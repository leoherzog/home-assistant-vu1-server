name: Home Assistant Add-on CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Add-On Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upstream pin matches vu-server submodule
        run: grep -q "VU-Server.git#$(git ls-tree HEAD vu-server | awk '{print $3}') " vu-server-addon/Dockerfile

      - name: Home Assistant Add-on Linter
        uses: frenck/action-addon-linter@v2
        with:
          path: './vu-server-addon'
