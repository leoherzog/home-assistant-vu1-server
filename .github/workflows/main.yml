name: Home Assistant App CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: App Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Upstream pin matches vu-server submodule
        run: grep -q "VU-Server.git#$(git ls-tree HEAD vu-server | awk '{print $3}') " vu-server-addon/Dockerfile

      - name: Home Assistant App Linter
        uses: frenck/action-app-linter@v2
        with:
          path: './vu-server-addon'
