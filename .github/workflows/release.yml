name: Release

on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check config.yaml version matches the git tag
        id: check
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONFIG_VERSION="$(grep -E '^version:' vu-server-addon/config.yaml \
            | sed -E 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')"
          echo "Git tag (stripped): ${TAG}"
          echo "config.yaml version: ${CONFIG_VERSION}"
          if [ "${TAG}" != "${CONFIG_VERSION}" ]; then
            echo "::error::Git tag (${TAG}) does not match config.yaml version (${CONFIG_VERSION}). Bump config.yaml before tagging."
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare build matrix
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Prepare multi-arch matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: '["amd64", "aarch64"]'
          image-name: vu-server-addon

  build:
    name: Build ${{ matrix.arch }}
    needs: [verify, prepare]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and push app image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          context: ./vu-server-addon
          version: ${{ needs.verify.outputs.version }}
          labels: |
            io.hass.name=VU-Server
            io.hass.description=Runs the Streacom VU1 Server for controlling VU1 dials
            io.hass.type=app
            io.hass.url=https://github.com/leoherzog/home-assistant-vu1-server
          image-tags: |
            ${{ needs.verify.outputs.version }}
            latest
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish multi-arch manifest
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: '["amd64", "aarch64"]'
          image-name: vu-server-addon
          image-tags: |
            ${{ needs.verify.outputs.version }}
            latest
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
