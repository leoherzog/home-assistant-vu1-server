name: "VU-Server"
slug: "vu-server-addon"
description: "Runs the Streacom VU1 Server for controlling VU1 dials"
panel_icon: "mdi:speedometer"
version: "0.7.0"
url: "https://github.com/leoherzog/home-assistant-vu1-server"
image: "ghcr.io/leoherzog/vu-server-addon"
arch:
  - aarch64
  - amd64
init: false
startup: services
ports:
  "5340/tcp": null
ports_description:
  "5340/tcp": "VU-Server API. The integration does not need it. Mapping it gives your network admin access with a public key."
ingress: true
uart: true
backup_exclude:
  - "vu-server/upload/tmp_*"
options:
  log_level: info
schema:
  log_level: "list(debug|info)"
