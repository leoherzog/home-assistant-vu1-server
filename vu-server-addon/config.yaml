name: "VU-Server"
slug: "vu-server-addon"
description: "Add-on to run the Streacom VU1 Server for controlling VU1 dials"
panel_icon: "mdi:speedometer"
version: "0.4.0"
url: "https://github.com/leoherzog/home-assistant-vu1-server"
image: "ghcr.io/leoherzog/{arch}-vu-server-addon"
homeassistant: "2024.4.0"
stage: experimental
arch:
  - aarch64
  - amd64
init: false
ports:
  "5340/tcp": null
ports_description:
  "5340/tcp": "VU-Server API port (configure host port in HA for external access)"
ingress: true
watchdog: "http://[HOST]:[PORT:5340]/"
uart: true
udev: true
backup_exclude:
  - "vu-server/upload/tmp_*"
options:
  log_level: info
schema:
  log_level: "list(debug|info|warning|error)"
