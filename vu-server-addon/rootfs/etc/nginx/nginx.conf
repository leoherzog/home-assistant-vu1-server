daemon off;
error_log stderr crit; # [error] lines would log request URLs with keys
events {}
http {
  access_log off; # query strings carry API keys
  server {
    listen 8099;
    allow 172.30.32.2;
    deny all;
    location / {
      proxy_pass http://127.0.0.1:5340;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter_types text/javascript;
      sub_filter '"/api/v0/' '"api/v0/';
      sub_filter "'/api/v0/" "'api/v0/";
      sub_filter 'location.replace("/index.html' 'location.replace("index.html';
      sub_filter 'href="/"' 'href="./"';
      sub_filter 'href="/index.html' 'href="index.html';
    }
  }
}
